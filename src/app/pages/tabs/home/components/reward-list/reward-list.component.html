<div class="flex-space-between card-title-label">
  <p class="text-lg text-title">Membership Rewards</p>
</div>

<div *ngIf="isLoaded" class="reward-list flex-auto">
  <div
    class="reward-item"
    *ngFor="let i of visibleRewards"
    [routerLink]="['/reward', i.rewardId]"
    [state]="{ offer: i }">
    <img load="lazy" [src]="i.imageUrl || 'assets/images/app-offer.jpg'" />
    <p class="truncate-two-line reward-title">{{ i.name }}</p>

    <p
      class="text-center reward-action"
      [ngClass]="{ active: isClaimable(i) && availablePoints !== null && missingPoints(i) === 0 }">
      <ng-container *ngIf="!isClaimable(i)">MEMBER GIFT</ng-container>
      <ng-container *ngIf="isClaimable(i) && availablePoints === null">{{ i.pointsCost }} POINTS</ng-container>
      <ng-container *ngIf="isClaimable(i) && availablePoints !== null">
        <ng-container *ngIf="missingPoints(i) === 0; else needMore">CLAIM · {{ i.pointsCost }} PTS</ng-container>
        <ng-template #needMore>NEED {{ missingPoints(i) }} POINTS</ng-template>
      </ng-container>
    </p>
  </div>
</div>

<p *ngIf="isLoaded && isGuest && visibleRewards.length === 0" class="text-description reward-empty">
  No points rewards are available right now.
</p>

<div *ngIf="!isLoaded" class="reward-list flex-auto">
  <div class="reward-item" *ngFor="let i of [0, 1, 2, 3, 4]">
    <ion-skeleton-text [animated]="true" style="width: 100%; height: 240px"></ion-skeleton-text>
  </div>
</div>
